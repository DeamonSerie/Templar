[package]
name = "pallet-set-tan"
version.workspace = true
edition.workspace = true

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
frame-support = { version = "49.0", default-features = false }
frame-system = { version = "49.0", default-features = false }
pallet-set-pricing = { path = "../set-pricing", default-features = false }
sp-std = { version = "14.0", default-features = false }
templar-types = { path = "../../../crates/templar-types", default-features = false }
pallet-set-time = { path = "../set-time", default-features = false }
pallet-templar-debt-ledger = { path = "../templar-debt-ledger", default-features = false }
pallet-templar-lending = { path = "../templar-lending", default-features = false }
sp-runtime = { version = "49.0", default-features = false }

[dev-dependencies]
sp-core = { version = "43.0" }
sp-io = { version = "49.0" }
sp-runtime = { version = "49.0" }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-set-pricing/std",
    "pallet-set-time/std",
    "pallet-templar-debt-ledger/std",
    "pallet-templar-lending/std",
    "sp-std/std",
    "templar-types/std",
    "sp-runtime/std",
]
